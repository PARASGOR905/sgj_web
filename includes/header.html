<header class="sticky top-0 shadow-md simple-theme" style="background-color: var(--primary); border-bottom: 1px solid var(--border-light); color: white; z-index: 11000;">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-2 flex items-center justify-between gap-3 min-w-0 md:flex-row md:justify-between md:gap-8">

        <!-- Logo + wordmark -->
        <div class="flex min-w-0 items-center gap-3 sm:gap-4 md:justify-start md:flex-shrink-0">
            <div class="flex items-center justify-center w-auto h-10 sm:h-12 flex-shrink-0">
                <img src="{{pathPrefix}}assets/images/SGJ_LOGO.png" alt="SGJ Institute Logo" class="h-full w-auto object-contain">
            </div>
            <div class="min-w-0 leading-tight">
                <span class="block font-extrabold text-white text-base sm:text-lg tracking-wide truncate">SGJ Institute</span>
                <span class="block text-[10px] sm:text-xs font-semibold tracking-widest uppercase text-yellow-400 truncate mt-0.5">Management &amp; IT</span>
            </div>
        </div>

        <!-- Mobile menu toggle -->
        <button id="mobile-menu-btn"
            class="md:hidden flex h-11 w-11 flex-shrink-0 items-center justify-center rounded-xl border border-white/20 bg-white/15 text-white shadow-sm transition hover:bg-white/25 focus:outline-none focus:ring-2 focus:ring-[var(--accent)] focus:ring-offset-2 focus:ring-offset-[var(--primary)]"
            aria-label="Toggle menu" aria-expanded="false">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
        </button>

        <!-- Main navigation -->
        <nav id="main-nav"
            class="flex flex-col md:flex-row absolute md:static top-full left-0 w-full md:w-auto bg-[var(--primary)] md:bg-transparent shadow-lg md:shadow-none"
            role="navigation" aria-label="Main navigation">

            <a href="{{pathPrefix}}index.html"
               class="nav-link text-white hover:text-[var(--accent)] transition-colors duration-300 px-5 py-2.5 rounded-lg hover:bg-white/10 font-semibold text-sm md:text-base block">
                Home
            </a>

            <a href="{{pathPrefix}}about.html"
               class="nav-link text-white hover:text-[var(--accent)] transition-colors duration-300 px-5 py-2.5 rounded-lg hover:bg-white/10 font-semibold text-sm md:text-base block">
                About
            </a>

            <!-- Programs dropdown -->
            <div class="relative group">
                <button
                    class="nav-link w-full md:w-auto text-white hover:text-[var(--accent)] transition-colors duration-300 px-5 py-2.5 rounded-lg hover:bg-white/10 font-semibold text-sm md:text-base flex items-center gap-1 focus:outline-none focus:ring-2 focus:ring-[var(--accent)]"
                    aria-haspopup="true" aria-expanded="false" id="programs-btn">
                    Programs
                    <svg class="w-4 h-4 transition-transform group-focus-within:rotate-180 group-hover:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                    </svg>
                </button>

                <!-- Dropdown panel -->
                <div id="programs-dropdown"
                    class="md:absolute md:top-full md:left-0 mt-1 md:min-w-[180px] bg-[var(--primary)] md:bg-white md:text-gray-800 md:rounded-xl md:shadow-xl md:border md:border-blue-100 overflow-hidden hidden md:group-hover:block md:group-focus-within:block"
                    role="menu">
                    <a href="{{pathPrefix}}courses/bca.html"
                       class="block px-5 py-2.5 text-white md:text-gray-700 hover:bg-white/10 md:hover:bg-blue-50 font-medium text-sm"
                       role="menuitem">BCA — Computer Applications</a>
                    <a href="{{pathPrefix}}courses/bba.html"
                       class="block px-5 py-2.5 text-white md:text-gray-700 hover:bg-white/10 md:hover:bg-blue-50 font-medium text-sm"
                       role="menuitem">BBA — Business Administration</a>
                    <a href="{{pathPrefix}}courses/ba.html"
                       class="block px-5 py-2.5 text-white md:text-gray-700 hover:bg-white/10 md:hover:bg-blue-50 font-medium text-sm"
                       role="menuitem">BA — Bachelor of Arts</a>
                </div>
            </div>

            <a href="{{pathPrefix}}gallery.html"
               class="nav-link text-white hover:text-[var(--accent)] transition-colors duration-300 px-5 py-2.5 rounded-lg hover:bg-white/10 font-semibold text-sm md:text-base block">
                Gallery
            </a>

            <a href="{{pathPrefix}}downloads.html"
               class="nav-link text-white hover:text-[var(--accent)] transition-colors duration-300 px-5 py-2.5 rounded-lg hover:bg-white/10 font-semibold text-sm md:text-base block">
                Resources
            </a>

            <a href="{{pathPrefix}}contact.html"
               class="nav-link text-white hover:text-[var(--accent)] transition-colors duration-300 px-5 py-2.5 rounded-lg hover:bg-white/10 font-semibold text-sm md:text-base block">
                Contact
            </a>
        </nav>
    </div>
</header>

<script>
// Mobile: toggle the Programs dropdown on tap (desktop uses CSS hover).
(function () {
    var btn      = document.getElementById('programs-btn');
    var dropdown = document.getElementById('programs-dropdown');
    if (!btn || !dropdown) return;

    btn.addEventListener('click', function () {
        var open = !dropdown.classList.contains('hidden');
        dropdown.classList.toggle('hidden', open);
        btn.setAttribute('aria-expanded', String(!open));
    });

    // Close when focus moves away.
    document.addEventListener('click', function (e) {
        if (!btn.contains(e.target) && !dropdown.contains(e.target)) {
            dropdown.classList.add('hidden');
            btn.setAttribute('aria-expanded', 'false');
        }
    });
})();
</script>
