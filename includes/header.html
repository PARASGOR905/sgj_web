<header class="sticky top-0 z-50 shadow-md simple-theme" style="background-color: var(--primary); border-bottom: 1px solid var(--border-light);">
  <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
    <!-- Logo -->
    <div class="flex items-center gap-4">
      <!-- SGJ Institute Logo -->
      <div class="flex items-center justify-center w-12 h-12 bg-white rounded-lg shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-[#0B3C5D]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <!-- Academic Cap -->
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
          <path d="M6 12v5c3 3 9 3 12 0v-5"/>
          <!-- Book -->
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
      </div>
      <div>
        <span class="block font-bold text-white text-lg">SGJ Institute</span>
        <span class="block text-sm text-[#FFD700]">Management & IT</span>
      </div>
    </div>

    <!-- Mobile menu button -->
    <button id="mobile-menu-btn" class="md:hidden text-white focus:outline-none" aria-label="Toggle menu" aria-expanded="false">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>

    <!-- Nav -->
    <nav id="main-nav" class="md:flex items-center gap-8 text-white font-medium hidden" role="navigation" aria-label="Main navigation">
      <a href="./index.html" class="nav-link text-[var(--accent)] hover:text-white transition duration-300 px-3 py-2 rounded-lg hover:bg-[var(--accent)]/30">Home</a>
      <a href="./about.html" class="nav-link text-[var(--accent)] hover:text-white transition duration-300 px-3 py-2 rounded-lg hover:bg-[var(--accent)]/30">About</a>
      <a href="./gallery.html" class="nav-link text-[var(--accent)] hover:text-white transition duration-300 px-3 py-2 rounded-lg hover:bg-[var(--accent)]/30">Gallery</a>
      <a href="./downloads.html" class="nav-link text-[var(--accent)] hover:text-white transition duration-300 px-3 py-2 rounded-lg hover:bg-[var(--accent)]/30">Downloads</a>
      <a href="./contact.html" class="nav-link text-[var(--accent)] hover:text-white transition duration-300 px-3 py-2 rounded-lg hover:bg-[var(--accent)]/30">Contact</a>
    </nav>

    <div class="flex items-center gap-8">
      <button id="dark-mode-toggle" class="text-white focus:outline-none" aria-label="Toggle dark mode">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
        </svg>
      </button>
    </div>
  </div>
</header>
